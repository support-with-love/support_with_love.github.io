<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Привал Яндексоида</title>
  <meta name="description" content="Тихое место у костра для тех, у кого отменились важные мероприятия.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <div class="leaves" id="leaves" aria-hidden="true"></div>

  <div class="scene" aria-hidden="true">
    <div class="scene__inner">
      <div class="sprite scene__tree" id="tree"></div>
      <div class="sprite scene__knight" id="knight"></div>
      <div class="scene__fire">
        <div class="scene__glow"></div>
        <div class="sprite scene__flame" id="flame"></div>
        <div class="sprite scene__logs" id="logs"></div>
      </div>
    </div>
    <div class="scene__ground"></div>
  </div>

  <div class="app">
    <header class="header">
      <p class="header__brand">Привал Яндексоида</p>
      <div class="header__tools">
        <button class="tool" id="clearBtn" type="button">Новый привал</button>
        <button class="tool tool--icon" id="themeToggle" type="button" aria-label="Переключить тему">☾</button>
      </div>
    </header>

    <main class="main">
      <section class="welcome" id="welcome">
        <h1 class="welcome__title">Отдохни, воин. Это был тяжелый день.</h1>
        <!-- <p class="welcome__subtitle">* Мероприятия отменились, планы сломались. Присядь к костру: здесь никто ничего от тебя не ждёт.</p> -->
      </section>
      <ol class="chat" id="chat" aria-live="polite" aria-label="Диалог"></ol>
    </main>

    <footer class="composer" id="composer">
      <nav class="starters" aria-label="Подсказки">
        <button class="starters__item starters__item--mode" type="button" data-action="friend">Переработать негатив (как друг)</button>
        <button class="starters__item starters__item--mode" type="button" data-action="opponent">Переработать негатив (взгляд оппонента)</button>
        <button class="starters__item" type="button" data-action="tired">🔋 Я устал(-а)</button>
        <button class="starters__item" type="button" data-action="cat">🐈 Доза милоты</button>
      </nav>

      <form class="composer__form" id="form" autocomplete="off">
        <button class="composer__mode" id="modeChip" type="button"></button>
        <div class="composer__box">
          <label class="visually-hidden" for="input">Сообщение</label>
          <textarea class="composer__input" id="input" rows="1" maxlength="1000"></textarea>
          <button class="composer__send" type="submit" aria-label="Отправить">➤</button>
        </div>
        <p class="composer__hint">Enter — отправить, Shift+Enter — новая строка</p>
      </form>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
