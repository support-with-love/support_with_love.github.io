name: Обновить список картинок
on:
  workflow_dispatch:
  push:
    paths: ['images/**', 'tools/build-images.js', '.github/workflows/images.yml']
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/build-images.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.js
          git diff --staged --quiet || (git commit -m "Обновлён список картинок" && git push)
